<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<title>Live</title>

<!-- ⬇️ POPUNDER — Adsterra -->
<script src="https://pl31567446.profitableratecpmnetwork.com/db/0f/a0/db0fa0fa8ddc946ee7fb59d9786fbe7e.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/controls.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #player {
    position: fixed;
    inset: 0;
    background: #000;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
    z-index: 1;
  }

  /* SHIELD — tap to start */
  #shield {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 5;
    cursor: pointer;
    transition: opacity .3s;
    text-align: center;
    padding: 20px;
  }

  #shield.hide {
    opacity: 0;
    pointer-events: none;
  }

  .play-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4fc3ff, #1a9be8);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 26px;
    padding-left: 6px;
    box-shadow: 0 0 40px rgba(79,195,255,.5);
    transition: transform .2s;
  }

  #shield:hover .play-btn { transform: scale(1.06); }

  .shield-text {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .3px;
  }

  .shield-sub {
    font-family: ui-monospace, monospace;
    font-size: 10px;
    color: #4fc3ff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ERROR */
  #err {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #fff;
    z-index: 6;
    padding: 20px;
    text-align: center;
  }

  #err.on { display: flex; }
  #err .ic { font-size: 34px; }
  #err .ms { font-size: 14px; font-weight: 700; }
  #err .ss { font-size: 11px; color: #8ba0be; }

  /* STATUS TOAST */
  #status {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: rgba(0,0,0,.85);
    border: 1px solid rgba(79,195,255,.3);
    color: #c0c0c0;
    padding: 6px 14px;
    border-radius: 24px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    letter-spacing: 1px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: all .3s;
    backdrop-filter: blur(10px);
    pointer-events: none;
    white-space: nowrap;
  }

  #status.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  #status.hide {
    transform: translateX(-50%) translateY(-60px);
    opacity: 0;
  }

  .st-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4fc3ff;
    flex-shrink: 0;
  }

  #status.ok .st-dot { background: #22e6a0; }
  #status.warn .st-dot { background: #fb923c; }
  #status.err .st-dot { background: #f87171; }
</style>
</head>
<body>

<div id="player">
  <video id="video" playsinline webkit-playsinline preload="none"></video>

  <div id="shield">
    <div class="play-btn">▶</div>
    <div class="shield-text">Tap to start stream</div>
    <div class="shield-sub">HD · Live</div>
  </div>

  <div id="status"><span class="st-dot"></span><span id="statusMsg">Ready</span></div>

  <div id="err">
    <div class="ic">⚠️</div>
    <div class="ms">Stream unavailable</div>
    <div class="ss">Try again in a moment</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/shaka-player.ui.min.js"></script>

<script>
/* ══════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════ */
const CONFIG = {
  channelsJson: "https://sonujson-v5.pages.dev/Data/sports.json"
};

const $ = (id) => document.getElementById(id);
const video = $("video");
const shield = $("shield");
const errEl = $("err");
const statusEl = $("status");
const statusMsg = $("statusMsg");

let shakaPlayer = null;
let currentChannel = null;

/* ══════════════════════════════════════════════
   STATUS HELPER
   ══════════════════════════════════════════════ */
let statusTimer = null;
function setStatus(msg, type = "ok", dur = 3500) {
  statusMsg.textContent = msg;
  statusEl.className = "show " + type;
  clearTimeout(statusTimer);
  if (dur !== 0) {
    statusTimer = setTimeout(() => {
      statusEl.className = "hide " + type;
    }, dur);
  }
}

/* ══════════════════════════════════════════════
   URL ID
   ══════════════════════════════════════════════ */
function getIdFromUrl() {
  const p = new URLSearchParams(window.location.search);
  return p.get("") || p.get("id") || p.get("ch") || null;
}

/* ══════════════════════════════════════════════
   ERROR
   ══════════════════════════════════════════════ */
function showError() {
  errEl.classList.add("on");
  shield.classList.add("hide");
}

/* ══════════════════════════════════════════════
   COOKIE HELPERS — FIXED
   ══════════════════════════════════════════════ */
function rawCookie(c) {
  if (!c) return "";
  if (c.startsWith("__hdnea__=")) return c.slice(10);
  if (c.startsWith("__hdnea="))   return c.slice(9);
  return c;
}

function withCookie(u, r) {
  if (!u || !r) return u;
  if (u.indexOf("__hdnea__") !== -1) return u;
  return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
}

/* ══════════════════════════════════════════════
   LOAD JSON
   ══════════════════════════════════════════════ */
async function loadChannels() {
  try {
    const res = await fetch(CONFIG.channelsJson + "?t=" + Date.now(), {
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || !data.channels || !data.channels.length) throw new Error("empty");
    console.log("[channels]", data.channels.length);
    return data;
  } catch (e) {
    showError();
    return null;
  }
}

/* ══════════════════════════════════════════════
   SHIELD TAP → START
   ══════════════════════════════════════════════ */
shield.addEventListener("click", () => {
  if (!currentChannel) return;
  shield.classList.add("hide");
  startShaka(currentChannel);
});

/* ══════════════════════════════════════════════
   SHAKA PLAYER
   ══════════════════════════════════════════════ */
async function startShaka(ch) {
  if (typeof shaka === "undefined") { showError(); return; }

  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) { showError(); return; }

  setStatus("Loading…", "warn", 0);

  if (shakaPlayer) {
    try { await shakaPlayer.destroy(); } catch (e) {}
    shakaPlayer = null;
  }

  shakaPlayer = new shaka.Player();
  await shakaPlayer.attach(video);

  /* minimal UI — only play/pause + fullscreen + volume + time */
  new shaka.ui.Overlay(shakaPlayer, $("player"), video).configure({
    controlPanelElements: [
      "play_pause", "mute", "volume",
      "time_and_duration", "spacer",
      "picture_in_picture", "fullscreen"
    ],
    seekBarColors: {
      base: "#828282",
      buffered: "#ffc336",
      played: "#4fc3ff"
    },
    addSeekBar: true,
    fadeDelay: 3
  });

  const cookie = ch.cookie;
  const raw = rawCookie(cookie);
  const keyId = ch.key_id;
  const key = ch.key;

  shakaPlayer.configure({
    drm: { clearKeys: { [keyId]: key } },
    manifest: {
      defaultPresentationDelay: 4,
      retryParameters: { maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5, timeout: 30000 }
    },
    streaming: {
      lowLatencyMode: false,
      bufferingGoal: 10,
      rebufferingGoal: 1.5,
      bufferBehind: 25,
      safeSeekOffset: 4,
      stallEnabled: true,
      stallThreshold: 1,
      stallSkip: 0.3,
      inaccurateManifestTolerance: 0,
      retryParameters: { maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5, timeout: 30000 }
    },
    abr: {
      enabled: true,
      defaultBandwidthEstimate: 2000000,
      restrictions: { maxHeight: 1080 }
    }
  });

  const T = shaka.net.NetworkingEngine.RequestType;
  shakaPlayer.getNetworkingEngine().registerRequestFilter((type, req) => {
    req.headers["Referer"] = "https://www.jiotv.com/";
    req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    if (cookie) req.headers["Cookie"] = cookie;
    if (type === T.MANIFEST || type === T.SEGMENT) {
      req.uris = req.uris.map((u) => withCookie(u, raw));
    }
  });

  shakaPlayer.addEventListener("error", (ev) => {
    const err = ev.detail;
    const code = err && err.code;
    console.log("[shaka error]", code, err);
    const recoverable = [1001, 1002, 1003, 4012, 6006, 6007, 7000, 7001, 7002];
    if (recoverable.includes(code)) { setStatus("Buffering…", "warn", 0); return; }
    setStatus("Error " + code, "err", 5000);
    showError();
  });

  try {
    console.log("[shaka] loading:", ch.stream_url.slice(0, 100));
    await shakaPlayer.load(ch.stream_url);
    video.play().catch(() => { setStatus("Ready — Tap ▶", "ok", 5000); });
    setStatus("Live", "ok", 4000);
  } catch (e) {
    console.error("[shaka fail]", e);
    setStatus("Load fail", "err", 5000);
    showError();
  }
}

/* ══════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════ */
(async function init() {
  const id = getIdFromUrl();
  if (!id) { showError(); return; }

  const data = await loadChannels();
  if (!data) return;

  const ch = data.channels.find(c => c.id === id);
  if (!ch) { showError(); return; }

  currentChannel = ch;
  console.log("[ready]", ch.name);
})();
</script>
</body>
</html>
