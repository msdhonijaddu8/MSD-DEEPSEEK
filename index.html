<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<title>M.S.D Cricket Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Orbitron:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #05070a; --card: #0e131c; --card-2: #141b27;
    --line: #1c2533; --line-hot: #2a3a52;
    --txt: #e8eef7; --txt-dim: #8fa2bd; --txt-dark: #55677f;
    --blue: #2f80ff; --blue-2: #1e5fd8;
    --green: #00ff9d; --red: #ff3b5c; --gold: #ffb020; --violet: #a06bff;
    --sans: "Inter", -apple-system, sans-serif;
    --brand: "Orbitron", "Inter", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }
  html, body {
    background: var(--bg); color: var(--txt);
    font-family: var(--sans); min-height: 100vh;
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(47, 128, 255, 0.08), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(0, 255, 157, 0.04), transparent 45%);
    pointer-events: none; z-index: 0;
  }
  .wrap {
    position: relative; z-index: 1; max-width: 960px; margin: 0 auto;
    padding: 18px 14px 40px; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .brand-head { text-align: center; padding: 14px 0 6px; position: relative; }
  .brand-title {
    font-family: var(--brand); font-size: 32px; font-weight: 900;
    letter-spacing: 2px; line-height: 1.1; color: #2f80ff;
    text-shadow: 0 0 16px rgba(47,128,255,.8), 0 0 32px rgba(0,255,157,.4), 0 0 60px rgba(47,128,255,.3);
    text-transform: uppercase; word-break: break-word;
    animation: brandGlow 3s ease-in-out infinite;
  }
  @keyframes brandGlow {
    0%,100% { color:#2f80ff; text-shadow: 0 0 16px rgba(47,128,255,.8), 0 0 32px rgba(0,255,157,.4), 0 0 60px rgba(47,128,255,.3); }
    50%     { color:#00ff9d; text-shadow: 0 0 20px rgba(0,255,157,.9), 0 0 40px rgba(47,128,255,.6), 0 0 70px rgba(0,255,157,.3); }
  }
  .brand-sub {
    margin-top: 8px; font-family: var(--mono); font-size: 10px;
    letter-spacing: 4px; color: var(--txt-dark); text-transform: uppercase;
  }
  .brand-line {
    margin-top: 14px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--blue), var(--green), var(--blue), transparent);
    opacity: 0.5;
  }
  @media (max-width: 520px) {
    .brand-title { font-size: 20px; letter-spacing: 1px; }
    .brand-sub { font-size: 9px; letter-spacing: 3px; }
  }

  .channel-head { text-align: center; padding: 18px 0 14px; }
  .ch-live {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; background: rgba(255,59,92,.1);
    border: 1px solid rgba(255,59,92,.4); color: var(--red);
    font-weight: 700; letter-spacing: 1.5px; font-size: 10px;
    margin-bottom: 12px; text-transform: uppercase;
  }
  .ch-live i {
    width: 6px; height: 6px; background: var(--red); border-radius: 50%;
    box-shadow: 0 0 8px var(--red); animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
  .ch-name {
    font-family: var(--brand); font-size: 20px; font-weight: 800;
    color: var(--blue); letter-spacing: 1px;
    text-shadow: 0 0 24px rgba(47,128,255,.35), 0 0 48px rgba(47,128,255,.15);
    line-height: 1.2; word-break: break-word; text-transform: uppercase;
  }
  @media (max-width: 480px) { .ch-name { font-size: 15px; } }

  .player-section {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    width: 100%; padding: 8px 0;
  }
  .player-shell {
    width: 100%; max-width: 860px; margin: 0 auto;
    border-radius: 24px; overflow: hidden; background: #000;
    border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 40px rgba(47,128,255,.08);
    position: relative;
  }
  .player-frame {
    position: relative; background: #000;
    aspect-ratio: 16/9; width: 100%;
  }
  .player-frame video,
  .player-frame iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; display: block; background: #000;
  }

  .shield {
    position: absolute; inset: 0; background: rgba(0,0,0,.82);
    backdrop-filter: blur(6px); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    z-index: 5; cursor: pointer; transition: opacity .3s;
    padding: 20px; text-align: center;
  }
  .shield.hide { opacity: 0; pointer-events: none; }
  .play-btn {
    width: 76px; height: 76px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--blue-2));
    color: #fff; display: grid; place-items: center;
    font-size: 28px; padding-left: 6px;
    box-shadow: 0 0 44px rgba(47,128,255,.35), 0 8px 30px rgba(0,0,0,.5);
    transition: transform .2s;
  }
  .shield:hover .play-btn { transform: scale(1.06); }
  .shield-text { font-size: 14px; font-weight: 700; color: #fff; }
  .shield-sub { font-size: 11px; color: var(--txt-dark); letter-spacing: 1.5px; text-transform: uppercase; }

  .loader {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); z-index: 4;
  }
  .loader.on { display: flex; }
  .spinner {
    width: 42px; height: 42px; border: 3px solid rgba(255,255,255,.12);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls-row {
    margin-top: 14px; display: flex; gap: 10px; justify-content: center;
    flex-wrap: wrap; max-width: 860px; width: 100%;
    margin-left: auto; margin-right: auto;
  }
  .ctrl-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; background: var(--card);
    border: 1px solid var(--line-hot); border-radius: 12px;
    color: var(--txt); font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .ctrl-btn:hover {
    border-color: var(--blue); background: var(--card-2);
    box-shadow: 0 0 20px rgba(47,128,255,.2);
  }
  .ctrl-btn svg {
    width: 16px; height: 16px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .quality-wrap {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--card);
    border: 1px solid var(--line-hot); border-radius: 12px;
  }
  .quality-wrap label {
    font-family: var(--mono); font-size: 10px; color: var(--txt-dim);
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  .quality-wrap select {
    background: transparent; border: none; color: var(--txt);
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    cursor: pointer; outline: none; padding: 4px 6px;
  }
  .quality-wrap select option { background: var(--card); color: var(--txt); }

  .tg-bar {
    margin-top: 14px; display: flex; align-items: center; gap: 13px;
    padding: 13px 18px;
    background: linear-gradient(135deg, rgba(47,128,255,.12), rgba(30,95,216,.08));
    border: 1px solid rgba(47,128,255,.35); border-radius: 16px;
    text-decoration: none; color: var(--txt); transition: all .2s;
    max-width: 860px; margin-left: auto; margin-right: auto; width: 100%;
  }
  .tg-bar:hover {
    border-color: var(--blue); box-shadow: 0 0 26px rgba(47,128,255,.25);
    transform: translateY(-1px);
  }
  .tg-icon {
    width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%;
    background: linear-gradient(135deg, #2f80ff, #1e5fd8);
    display: grid; place-items: center;
    box-shadow: 0 4px 14px rgba(47,128,255,.4);
  }
  .tg-icon svg { width: 22px; height: 22px; fill: #fff; }
  .tg-text { flex: 1; }
  .tg-title { font-size: 14px; font-weight: 800; }
  .tg-sub { font-size: 11px; color: var(--txt-dim); margin-top: 2px; }
  .tg-arrow { color: var(--blue); font-size: 18px; font-weight: 700; }

  .share-bar {
    margin-top: 10px; display: flex; align-items: center;
    justify-content: center; gap: 10px; padding: 13px 18px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; cursor: pointer; transition: all .2s;
    color: var(--txt); font-family: inherit; font-size: 13px; font-weight: 700;
    max-width: 860px; margin-left: auto; margin-right: auto; width: 100%;
  }
  .share-bar:hover {
    border-color: var(--green); box-shadow: 0 0 20px rgba(0,255,157,.15);
  }
  .share-bar svg {
    width: 16px; height: 16px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .credit-footer {
    margin-top: 30px; text-align: center;
    padding: 24px 16px 12px; position: relative;
  }
  .credit-footer::before {
    content: ""; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%); width: 70%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--violet), var(--gold), var(--violet), transparent);
    opacity: .6;
  }
  .credit-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 4px;
    color: var(--txt-dark); text-transform: uppercase; margin-bottom: 10px;
  }
  .credit-name {
    font-family: var(--brand); font-size: 24px; font-weight: 900;
    letter-spacing: 2px; color: #ffb020; text-transform: uppercase;
    line-height: 1.2; word-break: break-word;
    animation: creditGlow 2.4s ease-in-out infinite;
  }
  @keyframes creditGlow {
    0%,100% { color:#ffb020; text-shadow: 0 0 12px rgba(255,176,32,.8), 0 0 24px rgba(255,59,92,.6), 0 0 40px rgba(160,107,255,.4); }
    50%     { color:#ff3b5c; text-shadow: 0 0 18px rgba(255,59,92,.9), 0 0 36px rgba(255,176,32,.7), 0 0 60px rgba(160,107,255,.5); }
  }
  @media (max-width: 520px) {
    .credit-name { font-size: 16px; letter-spacing: 1px; }
    .credit-label { font-size: 9px; letter-spacing: 3px; }
  }

  .popup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.85);
    backdrop-filter: blur(6px); z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 20px;
  }
  .popup-overlay.on { display: flex; animation: fadeIn .3s; }
  @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
  .popup {
    background: linear-gradient(160deg, var(--card-2), var(--card));
    border: 1px solid var(--line-hot); border-radius: 24px;
    padding: 32px 24px 24px; max-width: 340px; width: 100%;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(47,128,255,.15);
    animation: popIn .35s cubic-bezier(.22,1,.36,1);
  }
  @keyframes popIn {
    from { opacity:0; transform: scale(.9) translateY(14px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }
  .popup-tg {
    width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
    background: linear-gradient(135deg, #2f80ff, #1e5fd8);
    display: grid; place-items: center;
    box-shadow: 0 0 36px rgba(47,128,255,.5);
  }
  .popup-tg svg { width: 36px; height: 36px; fill: #fff; }
  .popup-title { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
  .popup-text {
    font-size: 13px; color: var(--txt-dim); line-height: 1.5; margin-bottom: 22px;
  }
  .popup-join {
    display: block; width: 100%; padding: 14px;
    background: linear-gradient(135deg, #2f80ff, #1e5fd8);
    border: none; border-radius: 12px; color: #fff;
    font-family: inherit; font-size: 14px; font-weight: 800;
    letter-spacing: .5px; cursor: pointer; text-decoration: none;
    text-align: center; box-shadow: 0 6px 20px rgba(47,128,255,.4);
    transition: transform .15s;
  }
  .popup-join:hover { transform: translateY(-1px); }
  .popup-joined {
    display: block; width: 100%; padding: 12px; margin-top: 10px;
    background: transparent; border: 1px solid var(--line-hot);
    border-radius: 12px; color: var(--txt-dim);
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .popup-joined:hover { color: var(--txt); border-color: var(--txt-dim); }

  .player-shell:fullscreen,
  .player-shell:-webkit-full-screen {
    border-radius: 0; border: none; max-width: none;
    width: 100vw; height: 100vh;
  }
  .player-shell:fullscreen .player-frame,
  .player-shell:-webkit-full-screen .player-frame {
    aspect-ratio: unset; height: 100%;
  }

  .error-screen {
    position: absolute; inset: 0; background: var(--card);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 24px;
    text-align: center; z-index: 6;
  }
  .error-screen .icon { font-size: 36px; }
  .error-screen .msg { font-size: 14px; font-weight: 700; color: var(--txt); }
  .error-screen .sub { font-size: 12px; color: var(--txt-dim); }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #fff; color: #000; padding: 10px 18px;
    border-radius: 8px; font-size: 13px; font-weight: 600;
    z-index: 9999; opacity: 0; transition: all .35s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    pointer-events: none;
  }
  .toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }

  video.mode-contain { object-fit: contain; }
  video.mode-fill { object-fit: fill; }
  video.mode-cover { object-fit: cover; }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand-head">
    <div class="brand-title">M.S.D Cricket Hub</div>
    <div class="brand-sub">Live Cricket · HD Stream</div>
    <div class="brand-line"></div>
  </div>

  <div class="channel-head">
    <div class="ch-live"><i></i>LIVE</div>
    <div class="ch-name" id="chName">Loading...</div>

  <div class="player-section">
    <div class="player-shell" id="playerShell">
      <div class="player-frame">

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/shaka-player.ui.min.js"></script>

<script>
/* ══════════════════════════════════════════════
   CONFIG — multiple fallback URLs
   ══════════════════════════════════════════════ */
const CONFIG = {
  channelsJsonUrls: [
    "https://sonujson-v5.pages.dev/Data/sports.json",
    "https://sonujson-v3.pages.dev/Data/sports.json",
    "https://sonujson-v4.pages.dev/Data/sports.json"
  ],
  telegramUrl: "https://t.me/MSD_cricketlinks",
  popupDelayMs: 3000
};

const $ = (id) => document.getElementById(id);
const video = $("video");
const iframe = $("iframe");
const shield = $("shield");
const loader = $("loader");
const chName = $("chName");
const playerShell = $("playerShell");
const popup = $("popup");
const qualitySelect = $("qualitySelect");
const fitBtn = $("fitBtn");
const fitLabel = $("fitLabel");

let hls = null;
let shakaPlayer = null;
let currentChannel = null;

const FITS = ["contain", "fill", "cover"];
let fitIdx = 0;
function applyFit() {
  video.classList.remove("mode-fill", "mode-cover");
  const m = FITS[fitIdx];
  if (m === "fill") video.classList.add("mode-fill");
  if (m === "cover") video.classList.add("mode-cover");
  fitLabel.textContent = m.charAt(0).toUpperCase() + m.slice(1);
}
fitBtn.addEventListener("click", () => { fitIdx = (fitIdx + 1) % FITS.length; applyFit(); });

function getIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("") || params.get("id") || params.get("ch") || null;
}

/* ── LOAD JSON with multiple fallbacks ── */
async function loadChannels() {
  for (const url of CONFIG.channelsJsonUrls) {
    try {
      const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) continue;
      const data = await res.json();
      if (data && data.channels && data.channels.length) {
        console.log("[loaded]", url, data.channels.length, "channels");
        return data;
      }
    } catch (e) {
      console.log("[failed]", url, e.message);
    }
  }
  showError("Channels load nahi hui", "koi bhi source kaam nahi kiya");
  return null;
}

function showError(msg, sub) {
  const frame = document.querySelector(".player-frame");
  const existing = frame.querySelector(".error-screen");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.className = "error-screen";
  el.innerHTML = `<div class="icon">⚠️</div><div class="msg">${msg}</div><div class="sub">${sub || ""}</div>`;
  frame.appendChild(el);
  shield.classList.add("hide");
}

function destroyPlayers() {
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  if (shakaPlayer) { try { shakaPlayer.destroy(); } catch (e) {} shakaPlayer = null; }
  video.pause();
  video.removeAttribute("src");
  video.load();
  iframe.src = "about:blank";
  qualitySelect.innerHTML = '<option value="-1">Auto</option>';
}

shield.addEventListener("click", () => {
  if (!currentChannel) return;
  shield.classList.add("hide");
  startPlayback(currentChannel);
});

function startPlayback(ch) {
  destroyPlayers();
  loader.classList.add("on");

  const explicit = (ch.type || "").toLowerCase();
  const url = ch.stream_url || ch.url || "";
  const lowerUrl = url.toLowerCase();

  let mode = "iframe";
  if (explicit === "iframe") mode = "iframe";
  else if (explicit === "mpd" || explicit === "dash" || explicit === "drm") mode = "shaka";
  else if (explicit === "hls" || explicit === "m3u8") mode = "hls";
  else if (lowerUrl.includes(".mpd")) mode = "shaka";
  else if (lowerUrl.includes(".m3u8") || lowerUrl.includes(".m3u")) mode = "hls";

  console.log("[dispatch]", { id: ch.id, mode, url: url.slice(0, 80) });

  if (mode === "shaka") return startShaka(ch);
  if (mode === "hls")   return startHls(ch);
  return startIframe(ch);
}

/* ── HLS ── */
function startHls(ch) {
  video.style.display = "block";
  iframe.style.display = "none";

  const url = ch.stream_url || ch.url;

  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true, lowLatencyMode: true,
      backBufferLength: 30, maxBufferLength: 15,
      manifestLoadingTimeOut: 12000, manifestLoadingMaxRetry: 3,
      levelLoadingTimeOut: 12000, fragLoadingTimeOut: 20000,
      xhrSetup: (xhr) => {
        if (ch.cookie) xhr.setRequestHeader("Cookie", ch.cookie);
        xhr.setRequestHeader("Referer", ch.referer || "https://www.jiotv.com/");
      }
    });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
      loader.classList.remove("on");
      video.play().catch(() => {});
      const levels = data.levels.map((l, i) => ({ i, height: l.height })).filter(l => l.height).sort((a, b) => b.height - a.height);
      qualitySelect.innerHTML = '<option value="-1">Auto</option>';
      levels.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l.i;
        opt.textContent = l.height + "p";
        qualitySelect.appendChild(opt);
      });
    });

    hls.on(Hls.Events.ERROR, (e, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else {
        hls.destroy();
        loader.classList.remove("on");
        showError("Stream abhi available nahi hai", "Telegram pe backup link dekho");
      }
    });

    setTimeout(() => {
      if (video.readyState < 2) {
        loader.classList.remove("on");
        showError("Stream slow ya offline hai", "Telegram pe try karo");
      }
    }, 15000);

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.addEventListener("loadedmetadata", () => {
      loader.classList.remove("on");
      video.play().catch(() => {});
    }, { once: true });
  } else {
    loader.classList.remove("on");
    showError("Browser HLS support nahi karta", "Chrome ya Safari use karo");
  }
}

/* ── SHAKA ── */
async function startShaka(ch) {
  video.style.display = "block";
  iframe.style.display = "none";

  if (typeof shaka === "undefined") {
    loader.classList.remove("on");
    showError("Shaka player load nahi hua", "internet check karo");
    return;
  }

  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) {
    loader.classList.remove("on");
    showError("Browser DASH support nahi karta", "Chrome / Edge / Safari use karo");
    return;
  }

  shakaPlayer = new shaka.Player();
  await shakaPlayer.attach(video);

  const playerConfig = {
    manifest: {
      defaultPresentationDelay: 4,
      ignoreTextStreamFailures: true,
      retryParameters: { maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5, timeout: 30000 }
    },
    streaming: {
      lowLatencyMode: false, bufferingGoal: 10, rebufferingGoal: 1.5,
      bufferBehind: 25, safeSeekOffset: 4,
      retryParameters: { maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5, timeout: 30000 }
    },
    abr: { enabled: true, defaultBandwidthEstimate: 2000000 }
  };

  if (ch.key_id && ch.key) {
    playerConfig.drm = { clearKeys: { [ch.key_id]: ch.key } };
  }

  shakaPlayer.configure(playerConfig);

  shakaPlayer.getNetworkingEngine().registerRequestFilter((type, req) => {
    if (ch.cookie) req.headers["Cookie"] = ch.cookie;
    req.headers["Referer"] = ch.referer || "https://www.jiotv.com/";
    req.headers["User-Agent"] = ch.user_agent ||
      "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
  });

  shakaPlayer.addEventListener("error", (ev) => {
    const err = ev.detail;
    const code = err && err.code;
    console.log("[shaka error]", code, err);
    loader.classList.remove("on");
    showError("Stream error", "Telegram pe backup link dekho");
  });

  try {
    await shakaPlayer.load(ch.stream_url || ch.url);
    loader.classList.remove("on");
    video.play().catch(() => {});

    setTimeout(() => {
      try {
        const tracks = shakaPlayer.getVariantTracks();
        if (tracks && tracks.length) {
          const heights = [...new Set(tracks.map(t => t.height).filter(Boolean))].sort((a, b) => b - a);
          qualitySelect.innerHTML = '<option value="-1">Auto</option>';
          heights.forEach(h => {
            const opt = document.createElement("option");
            opt.value = h;
            opt.textContent = h + "p";
            qualitySelect.appendChild(opt);
          });
        }
      } catch (e) {}
    }, 800);

  } catch (e) {
    console.error("[shaka load fail]", e);
    loader.classList.remove("on");
    showError("Stream load fail hua", "Telegram pe backup link dekho");
  }
}

function startIframe(ch) {
  video.style.display = "none";
  iframe.style.display = "block";
  iframe.src = ch.stream_url || ch.url;
  setTimeout(() => loader.classList.remove("on"), 1200);
}

qualitySelect.addEventListener("change", (e) => {
  const val = e.target.value;
  if (hls) hls.currentLevel = parseInt(val);
  if (shakaPlayer) {
    const n = parseInt(val);
    const tracks = shakaPlayer.getVariantTracks();
    if (n === -1) shakaPlayer.configure({ abr: { enabled: true } });
    else {
      const target = tracks.find(t => t.height === n);
      if (target) {
        shakaPlayer.configure({ abr: { enabled: false } });
        shakaPlayer.selectVariantTrack(target, true);
      }
    }
  }
});

$("fsBtn").addEventListener("click", () => {
  const el = playerShell;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
});

$("shareBtn").addEventListener("click", async () => {
  const data = { title: document.title, text: "M.S.D Cricket Hub — live match dekh", url: window.location.href };
  if (navigator.share) {
    try { await navigator.share(data); return; } catch (e) {}
  }
  try {
    await navigator.clipboard.writeText(window.location.href);
    toast("Link copied!");
  } catch (e) { prompt("Copy this link:", window.location.href); }
});

const toastEl = $("toast");
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 1800);
}

$("tgBar").href = CONFIG.telegramUrl;
$("popupJoin").href = CONFIG.telegramUrl;
setTimeout(() => popup.classList.add("on"), CONFIG.popupDelayMs);
$("popupJoined").addEventListener("click", () => popup.classList.remove("on"));

(async function init() {
  applyFit();

  const id = getIdFromUrl();
  if (!id) {
    showError("No channel ID in URL", "URL format: ?=H2HD");
    chName.textContent = "—";
    return;
  }

  const data = await loadChannels();
  if (!data || !data.channels) {
    chName.textContent = "—";
    return;
  }

  const ch = data.channels.find(c => c.id === id);
  if (!ch) {
    chName.textContent = "Channel not found";
    showError("Channel nahi mila: " + id, "channel id check karo");
    return;
  }

  currentChannel = ch;
  chName.textContent = ch.name || id;
  document.title = (ch.name || "Live") + " · M.S.D Cricket Hub";

  console.log("[ready]", ch.name, "· tap shield to start");
})();
</script>
